plugins {
    id 'net.fabricmc.fabric-loom' version '1.19.1'
}

version = project.mod_version
group = project.maven_group

repositories {
    maven {
        name = "TerraformersMC"
        url = "https://maven.terraformersmc.com/"
    }
    maven {
        name = "Jei"
        url = "https://maven.blamejared.com/"
    }
    maven {
        name = "ModMaven"
        url = "https://modmaven.dev"
    }
    maven {
        name = "Cloth Config, Cloth Math, Rei"
        url = "https://maven.shedaniel.me/"
    }
    maven {
        name = "Jade"
        url "https://www.cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    compileOnly files("libs/jade-Fabric-26.2.jar")

    implementation("mezz.jei:jei-${project.jei_version}") {
        exclude(group: "mezz.jei")
    }

    // EMI (link-fgfgui fork for 26.1.2) - optional compat, compileOnly
    compileOnly files("libs/emi-xplat-dev.jar")

    runtimeOnly("me.shedaniel:RoughlyEnoughItems-fabric:${rei_version}")
    compileOnly("me.shedaniel:RoughlyEnoughItems-runtime-fabric:${rei_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }
    compileOnly("me.shedaniel:RoughlyEnoughItems-api-fabric:${rei_version}")
    compileOnly("me.shedaniel:RoughlyEnoughItems-default-plugin-fabric:${rei_version}")
    compileOnly("dev.architectury:architectury-fabric:${architectury_version}")
    compileOnly("me.shedaniel.cloth:basic-math:${cloth_math_version}")

    api "com.terraformersmc:modmenu:${project.mod_menu_version}"
    api("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }

    compileOnly "org.projectlombok:lombok:${project.lombok_version}"
    annotationProcessor "org.projectlombok:lombok:${project.lombok_version}"
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    filteringCharset = "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version_range": project.minecraft_version_range,
                "loader_version": project.loader_version,
                "mod_id": project.mod_id,
                "mod_name": project.mod_name
    }
}

def targetJavaVersion = 25
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release = targetJavaVersion
    }
}

base {
    archivesName = "${project.archives_base_name}-${project.minecraft_version}"
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${base.archivesName.get()}" }
    }
}